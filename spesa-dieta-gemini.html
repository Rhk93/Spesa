<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa Dieta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Spesa della Dieta</title>
<style>
/* Layout: schermate iOS a liste raggruppate, titolo grande, barra schede in basso. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --label:#000000;
  --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --tint:#007aff; --tint-weak:rgba(0,122,255,.12);
  --good:#34c759; --bad:#ff3b30; --bar:rgba(249,249,249,.88); --fill:rgba(120,120,128,.14);
  --scrim:rgba(0,0,0,.4);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1c1c1e; --label:#ffffff;
    --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --tint:#0a84ff; --tint-weak:rgba(10,132,255,.2);
    --good:#30d158; --bad:#ff453a; --bar:rgba(29,29,31,.88); --fill:rgba(120,120,128,.28);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--label);font:17px/1.3 var(--font);
  -webkit-font-smoothing:antialiased;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--tint)}
#app{max-width:640px;margin:0 auto}

.lt{margin:6px 0 10px}
.ltrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.lt .sub{margin:4px 0 0;font-size:15px;color:var(--label2)}
.link{background:none;border:0;color:var(--tint);font-size:17px;padding:4px 0;cursor:pointer}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:10px 0 6px}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wd small{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.wd[aria-pressed="true"] b{background:var(--tint);color:#fff}
.wd[aria-pressed="true"] small{color:var(--tint)}

.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:10px 2px 0}
.prog i{display:block;height:100%;background:var(--tint);border-radius:2px;transition:width .25s ease}

.gh{margin:24px 16px 6px;font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;transition:opacity .16s ease,transform .16s ease}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.group.plain .row+.row::before,.group .row.ed+.row::before,.group .row.act+.row::before,.group .row.act::before,.group .row.fld+.row::before{left:16px}
.item{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.item:active{background:var(--fill)}
.item:focus-visible,.btn:focus-visible,.link:focus-visible,.tab:focus-visible,.wd:focus-visible,.act:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.leaving{opacity:0;transform:translateX(10px)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--label2);overflow-wrap:anywhere}
.qt{flex:none;color:var(--label2);font-variant-numeric:tabular-nums;text-align:right;max-width:45%}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.on .chk{background:var(--tint);border-color:var(--tint)}
.on .chk svg{opacity:1}
.on .nm{color:var(--label2);text-decoration:line-through}
.row.act{width:100%;border:0;background:none;color:var(--tint);text-align:left;cursor:pointer}
.row.act.bad{color:var(--bad)}
.okbadge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.okbadge svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

.row.ed{align-items:flex-start;padding:10px 16px 10px 12px}
.del{flex:none;width:24px;height:24px;margin-top:6px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.edf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.edf input,.fld input{width:100%;border:0;border-radius:8px;background:var(--fill);padding:8px 10px;min-width:0}
.edf .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edf .r input:last-child{grid-column:1 / -1}
.row.fld{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px}
.row.fld label{font-size:13px;color:var(--label2)}
input:focus-visible,#diet-text:focus-visible{outline:2px solid var(--tint)}

.card{background:var(--cell);border-radius:14px;padding:20px 18px;margin-top:18px}
.note{background:var(--tint-weak);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:34px 20px}
.empty .ic{width:64px;height:64px;border-radius:16px;background:var(--tint-weak);color:var(--tint);display:grid;place-items:center}
.empty .ic svg,.sheet-ic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:4px 0 0;font-size:22px;font-weight:700}
.empty p,.muted{margin:0;color:var(--label2);font-size:15px}
.empty p{max-width:34ch}
.small-empty{color:var(--label2);text-align:center;padding:28px 12px;font-size:15px}
.steps{margin:0;padding-left:20px;color:var(--label2);font-size:15px;display:flex;flex-direction:column;gap:6px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;padding:15px 16px;text-align:center;cursor:pointer}
.btn.sec{background:var(--tint-weak);color:var(--tint)}
.btn.ghost{background:none;color:var(--tint);font-weight:400}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;line-height:1.2;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--tint)}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
#sheet .sh{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:22px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sh h3{margin:0;font-size:22px;font-weight:700;text-align:center}
.sh p{margin:0;font-size:15px;color:var(--label2);text-align:center}
.sheet-ic{align-self:center;width:64px;height:64px;border-radius:16px;background:var(--tint-weak);color:var(--tint);display:grid;place-items:center}
#diet-text{width:100%;min-height:180px;border:0;border-radius:12px;background:var(--cell);padding:12px;resize:vertical}
.spin{align-self:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--tint);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-top-color:var(--tint);border-right-color:var(--tint)}.row,.prog i{transition:none}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--label);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:min(90%,420px);text-align:center}
</style>
</head>
<body>

<div id="app"><main id="view" aria-live="polite"></main></div>

<nav id="tabbar" aria-label="Schede"><div class="in">
  <button class="tab" data-tab="spesa" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 4h2.3l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1"/><circle cx="9.7" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Spesa</button>
  <button class="tab" data-tab="settimana" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Settimana</button>
  <button class="tab" data-tab="dieta" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v7M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10v11M17 21V3c-2.2 1.6-3.5 4.4-3.5 8H17"/></svg>Dieta</button>
  <button class="tab" data-tab="impostazioni" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Impostazioni</button>
</div></nav>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var DAY_NAMES=['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
var DAY_SHORT=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
var LS_DATA='spesa-dieta-v2', LS_CFG='spesa-dieta-cfg-v1';
var DEFAULT_MODEL='gemini-flash-latest';
var MAX_BYTES=18*1024*1024;
var reduced=false; try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

var S={tab:'spesa',sel:0,diet:null,checks:{},cfg:{key:'',model:DEFAULT_MODEL},edit:false,banner:false,sheet:null,err:'',confirmDel:false};
var ctl=null,toastT=null,confirmT=null;

/* ---------- utilità ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function kOf(d){return (d.getDay()+6)%7}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dates(){var t=new Date();t.setHours(12,0,0,0);var a=[];for(var i=1;i<=7;i++){var d=new Date(t);d.setDate(t.getDate()+i);a.push(d)}return a}
function longDate(d){return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
function shortDate(d){return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
function fmtNum(n){return Number(n).toLocaleString('it-IT',{maximumFractionDigits:1})}
function qtyText(it){
  if(it.qty==null||it.qty==='') return 'q.b.';
  return fmtNum(it.qty)+(it.unit?' '+it.unit:'');
}
function newId(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';

/* ---------- salvataggio sul telefono ---------- */
function loadAll(){
  try{var c=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(c){S.diet=c.diet||null;S.checks=c.checks||{}}}catch(e){}
  try{var g=JSON.parse(localStorage.getItem(LS_CFG)||'null');if(g){S.cfg.key=g.key||'';S.cfg.model=g.model||DEFAULT_MODEL}}catch(e){}
}
function saveData(){try{localStorage.setItem(LS_DATA,JSON.stringify({diet:S.diet,checks:S.checks}))}catch(e){}}
function saveCfg(){try{localStorage.setItem(LS_CFG,JSON.stringify(S.cfg))}catch(e){}}
function prune(){
  var today=iso(new Date()),out={};
  Object.keys(S.checks).forEach(function(k){if(k.split('|')[0]>=today) out[k]=1});
  S.checks=out;
}

/* ---------- dieta d'esempio ---------- */
function exampleDiet(){
  var lunch=[
    [['Pasta integrale',80,'g'],['Passata di pomodoro',100,'g'],['Parmigiano Reggiano',10,'g']],
    [['Riso basmati',80,'g'],['Zucchine',200,'g'],['Olio extravergine d\'oliva',10,'g']],
    [['Pane integrale',100,'g'],['Tonno al naturale',80,'g'],['Insalata mista',100,'g']]
  ];
  var dinner=[
    [['Petto di pollo',150,'g'],['Spinaci',200,'g'],['Pane integrale',50,'g']],
    [['Merluzzo',180,'g'],['Patate',200,'g'],['Pomodori',100,'g']],
    [['Uova',2,'pz'],['Broccoli',200,'g'],['Pane integrale',50,'g']]
  ];
  var days={};
  function mk(arr){return arr.map(function(a){return {id:newId(),food:a[0],qty:a[1],unit:a[2],note:''}})}
  for(var k=0;k<7;k++){
    days[k]={meals:[
      {name:'Colazione',items:mk([['Latte parzialmente scremato',200,'ml'],['Fette biscottate integrali',30,'g'],['Marmellata',15,'g']])},
      {name:'Spuntino',items:mk([['Mela',150,'g'],['Mandorle',15,'g']])},
      {name:'Pranzo',items:mk(lunch[k%3])},
      {name:'Cena',items:mk(dinner[(k+1)%3])}
    ]};
  }
  return {v:1,updated:Date.now(),example:true,days:days};
}

/* ---------- viste ---------- */
function head(title,sub,right){
  return '<header class="lt"><div class="ltrow"><h1>'+esc(title)+'</h1>'+(right||'')+'</div><p class="sub">'+esc(sub)+'</p></header>';
}
function strip(){
  return '<div class="week" role="group" aria-label="Giorni">'+dates().map(function(d,i){
    return '<button class="wd" data-sel="'+i+'" aria-pressed="'+(i===S.sel)+'" aria-label="'+esc(longDate(d))+'"><small>'+DAY_SHORT[kOf(d)]+'</small><b>'+d.getDate()+'</b></button>';
  }).join('')+'</div>';
}
function emptyState(){
  return '<div class="card empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></div>'
   +'<h2>Carica la tua dieta</h2><p>Scegli il PDF o le foto della dieta. Gemini legge pasti e quantità e prepara la spesa giorno per giorno.</p>'
   +'<div class="stack"><button class="btn" data-act="import">Importa la dieta</button><button class="btn ghost" data-act="example">Prova con una dieta d\'esempio</button></div></div>';
}
function itemRow(it,checked){
  return '<div class="row item'+(checked?' on':'')+'" role="checkbox" aria-checked="'+checked+'" tabindex="0" data-id="'+it.id+'">'
   +'<span class="chk">'+CHECK+'</span><span class="txt"><span class="nm">'+esc(it.food)+'</span>'+(it.note?'<span class="nt">'+esc(it.note)+'</span>':'')+'</span>'
   +'<span class="qt">'+esc(qtyText(it))+'</span></div>';
}
function viewSpesa(){
  var ds=dates(),d=ds[S.sel],k=kOf(d);
  if(!S.diet) return head('Spesa','Per la dieta di domani')+emptyState();
  var day=S.diet.days[k],dk=iso(d),todo=[],done=[];
  ((day&&day.meals)||[]).forEach(function(m){
    var t=[];
    m.items.forEach(function(it){ if(S.checks[dk+'|'+it.id]) done.push(it); else t.push(it) });
    if(t.length) todo.push({name:m.name,items:t});
  });
  var nTodo=todo.reduce(function(a,m){return a+m.items.length},0),total=nTodo+done.length;
  var sub=longDate(d)+' · '+(total===0?'nessun alimento':(nTodo?nTodo+' da prendere':'tutto nel carrello'));
  var h=head(S.sel===0?'Domani':cap(DAY_NAMES[k]),sub)+strip();
  if(total>0) h+='<div class="prog" aria-hidden="true"><i style="width:'+Math.round(done.length/total*100)+'%"></i></div>';
  if(S.diet.example) h+='<div class="note"><span>Questa è una dieta d\'esempio per provare le spunte.</span><button class="link" data-act="import">Importa la tua dieta</button></div>';
  if(total===0){
    h+='<p class="small-empty">Nella dieta non ci sono alimenti per questo giorno.</p>';
  }else{
    todo.forEach(function(m){
      h+='<h2 class="gh">'+esc(m.name)+'</h2><div class="group">'+m.items.map(function(it){return itemRow(it,false)}).join('')+'</div>';
    });
    if(nTodo===0) h+='<div class="group" style="margin-top:20px"><div class="row"><span class="okbadge">'+CHECK+'</span><span class="txt"><span class="nm">Hai preso tutto'+(S.sel===0?' per domani':'')+'</span></span></div></div>';
    if(done.length) h+='<h2 class="gh">Nel carrello · '+done.length+'</h2><div class="group">'+done.map(function(it){return itemRow(it,true)}).join('')+'</div>';
    if(done.length) h+='<div style="text-align:center;margin-top:18px"><button class="link" data-act="reset">Azzera le spunte</button></div>';
  }
  return h;
}
function aggregate(){
  var map={},ds=dates();
  ds.forEach(function(d,i){
    var day=S.diet.days[kOf(d)]; if(!day) return;
    day.meals.forEach(function(m){m.items.forEach(function(it){
      var key=norm(it.food); if(!key) return;
      var e=map[key]||(map[key]={food:it.food,units:{},days:[]});
      if(e.days.indexOf(i)<0) e.days.push(i);
      if(it.qty!=null){var u=String(it.unit||'').toLowerCase();e.units[u]=(e.units[u]||0)+Number(it.qty)}
    })});
  });
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.food.localeCompare(b.food,'it')});
}
function viewSettimana(){
  var ds=dates();
  if(!S.diet) return head('Settimana','Totali da comprare')+emptyState();
  var list=aggregate();
  var h=head('Settimana',shortDate(ds[0])+' – '+shortDate(ds[6])+' · '+list.length+' alimenti');
  if(!list.length) return h+'<p class="small-empty">Nella dieta non ci sono alimenti per i prossimi 7 giorni.</p>';
  h+='<p class="muted" style="margin:6px 2px 0">Quantità totali dei prossimi 7 giorni, da domani.</p><div class="group plain" style="margin-top:14px">';
  list.forEach(function(e){
    var parts=Object.keys(e.units).map(function(u){return fmtNum(e.units[u])+(u?' '+u:'')});
    var days=e.days.map(function(i){return DAY_SHORT[kOf(ds[i])]}).join(', ');
    h+='<div class="row"><span class="txt"><span class="nm">'+esc(e.food)+'</span><span class="nt">'+esc(days)+'</span></span><span class="qt">'+esc(parts.length?parts.join(' + '):'q.b.')+'</span></div>';
  });
  return h+'</div>';
}
function viewDieta(){
  var ds=dates(),d=ds[S.sel],k=kOf(d);
  if(!S.diet) return head('Dieta','Nessuna dieta caricata')+emptyState();
  var right='<button class="link" data-act="edit">'+(S.edit?'Fine':'Modifica')+'</button>';
  var h=head('Dieta',cap(longDate(d)),right)+strip();
  if(S.banner) h+='<div class="note"><span>Controlla che alimenti e quantità siano giusti. Puoi correggere o eliminare le righe, poi tocca Fine.</span></div>';

           +'<div class="r"><input id="f-'+it.id+'-qty" data-f="qty" inputmode="decimal" value="'+(it.qty==null?'':esc(String(it.qty).replace('.',',')))+'" placeholder="Quantità" aria-label="Quantità">'
           +'<input id="f-'+it.id+'-unit" data-f="unit" value="'+esc(it.unit)+'" placeholder="Unità (g, ml, pz)" aria-label="Unità">'
           +'<input id="f-'+it.id+'-note" data-f="note" value="'+esc(it.note)+'" placeholder="Note" aria-label="Note"></div></div></div>';
        }else{
          h+='<div class="row" data-id="'+it.id+'"><span class="txt"><span class="nm">'+esc(it.food)+'</span>'+(it.note?'<span class="nt">'+esc(it.note)+'</span>':'')+'</span><span class="qt">'+esc(qtyText(it))+'</span></div>';
        }
      });
      if(S.edit) h+='<button class="row act" data-act="add" data-k="'+k+'" data-m="'+mi+'">Aggiungi alimento</button>';

  h+='<div class="group plain" style="margin-top:28px"><button class="row act" data-act="import">Sostituisci la dieta…</button><button class="row act bad" data-act="reset">Azzera le spunte</button></div>';
  return h;
}

   +'<div class="row fld"><label for="cfg-model">Modello</label><input id="cfg-model" type="text" autocapitalize="off" spellcheck="false" value="'+esc(S.cfg.model)+'" placeholder="'+DEFAULT_MODEL+'"></div>'

/* ---------- foglio importazione ---------- */

     +'<h3>Importa la dieta</h3><p>Scegli il PDF o le foto della dieta. Le pagine vengono inviate a Gemini per la lettura. Poi controlli il risultato prima di usarlo.</p>'

     +'<button class="btn sec" data-act="pick-text">Incolla il testo</button><button class="btn ghost" data-act="sheet-close">Annulla</button></div>';

  }

function setBusy(m){var e=$('#busy-msg');if(e)e.textContent=m}
function openSheet(m){S.sheet=m;renderSheet()}
function closeSheet(){S.sheet=null;renderSheet()}
function openImport(){openSheet(S.cfg.key?'pick':'nokey')}

/* ---------- lettura con Gemini ---------- */
function buildPrompt(isText,text){
  var src=isText?('Ecco il testo di una dieta (piano alimentare) italiana:\n\n'+text)
    :'I file allegati sono le pagine di una dieta (piano alimentare) italiana. Leggili con attenzione, nell\'ordine in cui sono dati.';
  return src+'\n\nEstrai gli alimenti da mangiare per ogni giorno e pasto. Rispondi SOLO con JSON, senza altro testo, in questo formato:\n'
   +'{"days":[{"day":"Lunedì","meals":[{"meal":"Colazione","items":[{"food":"Latte parzialmente scremato","qty":200,"unit":"ml","note":""}]}]}]}\n\n'
   +'Regole:\n'
   +'- "day" è uno tra Lunedì, Martedì, Mercoledì, Giovedì, Venerdì, Sabato, Domenica. Se il piano è identico tutti i giorni (un solo schema giornaliero), usa un solo elemento con "day":"Tutti i giorni".\n'
   +'- Se il piano ha più settimane o schemi alternativi, usa solo il primo.\n'
   +'- "meal" è il nome del pasto come scritto nella dieta (Colazione, Spuntino, Pranzo, Merenda, Cena...).\n'
   +'- "food" è il nome dell\'alimento senza la quantità, con la maiuscola iniziale.\n'
   +'- "qty" è un numero (grammi o millilitri come indicati). Se la quantità manca o è "q.b." o "a piacere", usa null.\n'
   +'- "unit" è g, ml, pz, fetta, cucchiaio, cucchiaino, vasetto o simili. Per le uova e la frutta contata a pezzi usa pz.\n'
   +'- Se un pasto offre alternative ("oppure", "a scelta"), prendi la prima opzione e scrivi le altre in "note" come "In alternativa: ...".\n'
   +'- Ometti "note" se vuota. Non includere acqua, consigli generali o indicazioni sulla frequenza settimanale.\n'
   +'- Non inventare alimenti e non cambiare le quantità.';
}
function fileToPart(f){
  return new Promise(function(res,rej){
    var mime=f.type;
    if(!mime){
      var n=f.name.toLowerCase();
      mime=/\.pdf$/.test(n)?'application/pdf':/\.png$/.test(n)?'image/png':/\.webp$/.test(n)?'image/webp':/\.hei[cf]$/.test(n)?'image/heic':'image/jpeg';
    }
    var r=new FileReader();
    r.onload=function(){res({inline_data:{mime_type:mime,data:String(r.result).split(',')[1]||''}})};
    r.onerror=function(){rej({code:'read'})};
    r.readAsDataURL(f);
  });
}
function parseJson(text){
  try{return JSON.parse(text)}catch(e){}
  var a=text.indexOf('{'),b=text.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(e){}}
  return null;
}
async function gemini(parts,signal){
  var model=String(S.cfg.model||DEFAULT_MODEL).trim().replace(/^models\//,'');
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
  var res;
  try{
    res=await fetch(url,{method:'POST',signal:signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':S.cfg.key},
      body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:{temperature:0,responseMimeType:'application/json',maxOutputTokens:24000}})});
  }catch(e){
    if(e&&e.name==='AbortError') throw {code:'cancelled'};
    throw {code:'network'};
  }
  var j=null; try{j=await res.json()}catch(e){}
  if(!res.ok){
    var msg=(j&&j.error&&j.error.message)||'';
    if(res.status===429) throw {code:'rate_limited'};
    if(res.status===404) throw {code:'bad_model'};
    if(res.status===400&&/api key/i.test(msg)) throw {code:'bad_key'};
    if(res.status===401||res.status===403) throw {code:'bad_key'};
    if(res.status>=500) throw {code:'upstream'};
    throw {code:'other'};
  }
  var cand=j&&j.candidates&&j.candidates[0];
  var text=((cand&&cand.content&&cand.content.parts)||[]).map(function(p){return p.text||''}).join('');
  if(!text) throw {code:(j&&j.promptFeedback&&j.promptFeedback.blockReason)?'refused':'empty'};
  var data=parseJson(text);
  if(!data) throw {code:'invalid_json'};
  return data;
}
function normalizeDiet(parts){
  var days={},count=0;
  function keys(name){
    var n=String(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(/tutt|ogni|quotid/.test(n)) return [0,1,2,3,4,5,6];
    var m=['lun','mar','mer','gio','ven','sab','dom'].indexOf(n.slice(0,3));
    return m>=0?[m]:[];
  }
  parts.forEach(function(p){
    var list=Array.isArray(p)?p:((p&&(p.days||p.giorni))||[]);
    list.forEach(function(d){
      keys(d.day||d.giorno).forEach(function(k){
        var day=days[k]||(days[k]={meals:[]});
        (d.meals||d.pasti||[]).forEach(function(m){
          var name=String(m.meal||m.nome||'Pasto').trim()||'Pasto';
          var meal=day.meals.find(function(x){return x.name.toLowerCase()===name.toLowerCase()});
          if(!meal){meal={name:name,items:[]};day.meals.push(meal)}
          (m.items||m.alimenti||[]).forEach(function(it){
            var food=String(it.food||it.cibo||'').trim(); if(!food) return;
            var q=it.qty!==undefined?it.qty:it.q;
            var qty=(q===null||q===undefined||q==='')?null:Number(String(q).replace(',','.'));
            meal.items.push({id:newId(),food:food,qty:Number.isFinite(qty)?qty:null,unit:String(it.unit||it.u||'').trim(),note:String(it.note||it.nota||'').trim()});
            count++;
          });
        });
      });
    });
  });
  return count?{v:1,updated:Date.now(),days:days}:null;
}
function errCopy(code){
  switch(code){
    case 'bad_key':return 'La chiave Gemini non è valida o non ha i permessi. Controllala in Impostazioni.';
    case 'bad_model':return 'Il modello indicato non esiste. In Impostazioni prova con '+DEFAULT_MODEL+'.';
    case 'rate_limited':return 'Hai raggiunto il limite di richieste del piano gratuito. Aspetta un minuto e riprova.';
    case 'network':return 'Nessuna connessione, oppure la richiesta è stata bloccata. Controlla la rete e riprova.';
    case 'upstream':return 'Gemini è sovraccarico in questo momento. Riprova tra poco.';
    case 'too_big':return 'I file sono troppo pesanti (massimo circa 18 MB in tutto). Prova con meno pagine o foto più leggere.';
    case 'no_pages':return 'Nei file scelti non ci sono pagine leggibili.';
    case 'read':return 'Non riesco a leggere uno dei file scelti. Riprova.';
    case 'invalid_json':case 'empty':case 'refused':return 'Non sono riuscito a ricavare i pasti. Prova con una foto più nitida, con meno pagine alla volta, oppure incolla il testo.';
    default:return 'Qualcosa è andato storto durante la lettura. Riprova.';
  }
}
async function runImport(src){
  if(!S.cfg.key){openSheet('nokey');return}
  ctl=new AbortController(); var signal=ctl.signal;
  openSheet('busy'); setBusy('Preparo i file…');
  try{
    var parts=[];
    if(src.text){
      parts.push({text:buildPrompt(true,src.text)});
    }else{
      var total=0,files=src.files.filter(function(f){return f.type==='application/pdf'||/^image\//.test(f.type)||/\.(pdf|jpe?g|png|webp|heic|heif)$/i.test(f.name)});
      if(!files.length) throw {code:'no_pages'};
      files.forEach(function(f){total+=f.size});
      if(total>MAX_BYTES) throw {code:'too_big'};
      for(var i=0;i<files.length;i++){
        if(signal.aborted) throw {code:'cancelled'};
        parts.push(await fileToPart(files[i]));
      }
      parts.push({text:buildPrompt(false)});
    }
    setBusy('Gemini sta leggendo la dieta…');
    var data=await gemini(parts,signal);
    var diet=normalizeDiet([data]);
    if(!diet) throw {code:'empty'};
    S.diet=diet; S.checks={}; S.tab='dieta'; S.edit=true; S.banner=true; S.sel=0;
    saveData(); closeSheet(); window.scrollTo(0,0); render();
  }catch(e){
    var code=e&&e.code;
    if(code==='cancelled'){closeSheet();toast('Importazione annullata');return}
    S.err=errCopy(code); openSheet('error');
  }finally{ ctl=null }
}

/* ---------- azioni ---------- */
function locate(id){
  if(!S.diet) return null;
  for(var k in S.diet.days){
    var day=S.diet.days[k];
    for(var mi=0;mi<day.meals.length;mi++){
      var m=day.meals[mi],ii=m.items.findIndex(function(x){return x.id===id});
      if(ii>=0) return {day:day,m:m,mi:mi,ii:ii,item:m.items[ii]};
    }
  }
  return null;
}
function toggle(id,row){
  if(row&&row.classList.contains('leaving')) return;
  var key=iso(dates()[S.sel])+'|'+id;
  function apply(){ if(S.checks[key]) delete S.checks[key]; else S.checks[key]=1; saveData(); render(); }
  if(row&&!reduced&&!S.checks[key]){ row.classList.add('leaving'); setTimeout(apply,170); } else apply();
}
function focusField(id,f){setTimeout(function(){var e=document.getElementById('f-'+id+'-'+f);if(e)e.focus()},30)}
function doAct(el){
  var a=el.dataset.act;
  if(a==='import'){openImport()}
  else if(a==='goto-settings'){closeSheet();S.tab='impostazioni';window.scrollTo(0,0);render()}
  else if(a==='pick-text'){openSheet('text')}
  else if(a==='sheet-close'){closeSheet()}
  else if(a==='retry'){openImport()}
  else if(a==='stop'){if(ctl) ctl.abort()}
  else if(a==='run-text'){var t=(($('#diet-text')||{}).value||'').trim();if(t.length<10){toast('Incolla prima il testo della dieta');return}runImport({text:t})}
  else if(a==='example'){S.diet=exampleDiet();S.checks={};saveData();render()}
  else if(a==='edit'){S.edit=!S.edit;if(!S.edit)S.banner=false;render()}
  else if(a==='reset'){S.checks={};saveData();render();toast('Spunte azzerate')}
  else if(a==='save-cfg'){
    S.cfg.key=($('#cfg-key').value||'').trim();
    S.cfg.model=($('#cfg-model').value||'').trim()||DEFAULT_MODEL;
    saveCfg(); render(); toast('Salvato');
  }
  else if(a==='wipe'){
    if(!S.confirmDel){S.confirmDel=true;render();clearTimeout(confirmT);confirmT=setTimeout(function(){S.confirmDel=false;if(S.tab==='impostazioni')render()},4000)}
    else{S.confirmDel=false;S.diet=null;S.checks={};saveData();render();toast('Dati cancellati')}
  }
  else if(a==='del'){
    var loc=locate(el.closest('[data-id]').dataset.id);
    if(loc){loc.m.items.splice(loc.ii,1);if(!loc.m.items.length)loc.day.meals.splice(loc.mi,1);saveData();render()}
  }
  else if(a==='add'){
    var day=S.diet.days[el.dataset.k],m=day&&day.meals[+el.dataset.m];
    if(m){var it={id:newId(),food:'',qty:null,unit:'g',note:''};m.items.push(it);saveData();render();focusField(it.id,'food')}
  }
  else if(a==='addmeal'){
    var k=el.dataset.k,d2=S.diet.days[k]||(S.diet.days[k]={meals:[]});
    var it2={id:newId(),food:'',qty:null,unit:'g',note:''};
    d2.meals.push({name:'Pasto',items:[it2]});saveData();render();focusField(it2.id,'food');
  }
}

document.addEventListener('click',function(e){
  var t=e.target;
  var tab=t.closest('[data-tab]'); if(tab){S.tab=tab.dataset.tab;S.edit=false;S.banner=false;S.confirmDel=false;window.scrollTo(0,0);render();return}
  var sel=t.closest('[data-sel]'); if(sel){S.sel=+sel.dataset.sel;render();return}
  var act=t.closest('[data-act]'); if(act){doAct(act);return}
  var row=t.closest('.item[data-id]'); if(row){toggle(row.dataset.id,row)}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('item')){e.preventDefault();toggle(e.target.dataset.id,e.target)}
});
document.addEventListener('input',function(e){
  var f=e.target.closest&&e.target.closest('[data-f]'); if(!f) return;
  var rowEl=f.closest('[data-id]'); if(!rowEl) return;
  var loc=locate(rowEl.dataset.id); if(!loc) return;
  var key=f.dataset.f;
  if(key==='qty'){
    var s=f.value.trim().replace(',','.');
    if(s==='') loc.item.qty=null; else if(Number.isFinite(Number(s))) loc.item.qty=Number(s);
  }else loc.item[key]=f.value;
  saveData();
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='file'){
    var files=Array.prototype.slice.call(e.target.files||[]);
    e.target.value='';
    if(files.length) runImport({files:files});
  }
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!S.edit&&!S.sheet&&S.tab!=='impostazioni'){prune();render()}});

/* ---------- icona e manifest (per aggiungere alla Home) ---------- */
function makeIcon(size){
  try{
    var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,0,size);g.addColorStop(0,'#3d9bff');g.addColorStop(1,'#0a66e0');
    x.fillStyle=g;x.fillRect(0,0,size,size);
    x.strokeStyle='#fff';x.lineWidth=size*.085;x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(size*.2,size*.3);x.lineTo(size*.29,size*.3);x.lineTo(size*.37,size*.62);x.lineTo(size*.74,size*.62);x.lineTo(size*.8,size*.42);x.lineTo(size*.31,size*.42);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(size*.42,size*.77,size*.05,0,7);x.arc(size*.68,size*.77,size*.05,0,7);x.fill();
    return c.toDataURL('image/png');
  }catch(e){return null}
}
function setupInstall(){
  try{
    var i180=makeIcon(180),i192=makeIcon(192),i512=makeIcon(512);
    if(i180){var l=document.createElement('link');l.rel='apple-touch-icon';l.href=i180;document.head.appendChild(l);
      var l2=document.createElement('link');l2.rel='icon';l2.href=i192;document.head.appendChild(l2)}
    if(/^https?:/.test(location.protocol)&&i192&&i512){
      var m={name:'Spesa della Dieta',short_name:'Spesa Dieta',lang:'it',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^\/]*$/,''),display:'standalone',background_color:'#f2f2f7',theme_color:'#007aff',
        icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
      var ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml);
    }
  }catch(e){}
}

loadAll(); prune(); render(); setupInstall();
})();
