<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1316" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valigia">
<title>La Mia Valigia</title>
<style>:root{color-scheme:light}body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
</head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una valigia disegnata con maniglia, ruote e chiusure; gli scomparti sono celle colorate cliccabili. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#10242a; --ink2:#5a6e75; --ink3:#8d9ea4;
  --line:#d8e1e4; --field:#e6edf0; --accent:#0f7a7d; --accent-ink:#ffffff; --accent-text:#0b6063;
  --shell:#17676b; --shell-dark:#0e464a; --shell-hi:rgba(255,255,255,.2); --inner:#dde8ea;
  --cs:82%; --cl:90%; --ss:60%; --sl:72%; --bad:#d92d20; --scrim:rgba(8,18,21,.45);
  --shadow:0 1px 2px rgba(16,36,42,.06),0 10px 28px rgba(16,36,42,.08);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1316; --surface:#142126; --ink:#e8f1f3; --ink2:#93a8ae; --ink3:#5f7479;
    --line:#233338; --field:#1b2c32; --accent:#3cc4c8; --accent-ink:#06282a; --accent-text:#3cc4c8;
    --shell:#0f4f53; --shell-dark:#082a2d; --shell-hi:rgba(255,255,255,.12); --inner:#0e1b1f;
    --cs:34%; --cl:24%; --ss:36%; --sl:38%; --bad:#ff6b5e; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1316; --surface:#142126; --ink:#e8f1f3; --ink2:#93a8ae; --ink3:#5f7479;
  --line:#233338; --field:#1b2c32; --accent:#3cc4c8; --accent-ink:#06282a; --accent-text:#3cc4c8;
  --shell:#0f4f53; --shell-dark:#082a2d; --shell-hi:rgba(255,255,255,.12); --inner:#0e1b1f;
  --cs:34%; --cl:24%; --ss:36%; --sl:38%; --bad:#ff6b5e; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;
  padding-block:14px 56px;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto}

.lt{margin:8px 0 14px}
.ltrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1,.setup h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,48px);line-height:1;letter-spacing:-.035em;font-variation-settings:"opsz" 96;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--ink2);font-size:15px}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;font-size:16px;padding:6px 0;cursor:pointer}
.link:focus-visible,.btn:focus-visible,.comp:focus-visible,.stp:focus-visible,.del:focus-visible,.addbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.srch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px}
.srch svg{flex:none;width:20px;height:20px;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round}
.srch input{flex:1;min-width:0;border:0;background:none;padding:13px 0;font-size:16px}
.srch input:focus{outline:none}
.srch:focus-within{border-color:var(--accent)}
.qr{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.qr.none{color:var(--ink2)}
.qr b{font-weight:700}

/* valigia */
.case{position:relative;margin:56px auto 40px;max-width:380px}
.handle{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:36%;height:46px;border:9px solid var(--shell-dark);border-bottom:0;border-radius:18px 18px 0 0}
.shell{position:relative;background:var(--shell);border-radius:30px;padding:16px 16px 30px;box-shadow:inset 0 0 0 3px var(--shell-hi),0 22px 34px rgba(8,30,33,.22)}
.shell::before,.shell::after{content:"";position:absolute;top:0;bottom:0;width:7px;background:var(--shell-dark);opacity:.55}
.shell::before{left:7px;border-radius:4px}.shell::after{right:7px;border-radius:4px}
.inner{position:relative;z-index:1;background:var(--inner);border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:minmax(112px,auto);gap:10px}
.latch{position:absolute;bottom:8px;width:44px;height:14px;border-radius:7px;background:var(--shell-dark);box-shadow:inset 0 2px 0 var(--shell-hi)}
.latch.l1{left:calc(50% - 56px)}.latch.l2{left:calc(50% + 12px)}
.wheel{position:absolute;bottom:-17px;width:30px;height:22px;background:#1b1f22;border-radius:0 0 12px 12px}
.wheel.w1{left:15%}.wheel.w2{right:15%}

.comp{position:relative;overflow:hidden;text-align:left;border:0;border-radius:16px;padding:12px 14px 12px 12px;cursor:pointer;
  background:hsl(var(--h) var(--cs) var(--cl));color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0;
  transition:transform .14s ease,opacity .16s ease,box-shadow .16s ease;-webkit-tap-highlight-color:transparent}
.comp::after{content:"";position:absolute;right:12px;top:-2px;bottom:-2px;width:9px;background:hsl(var(--h) var(--ss) var(--sl));opacity:.7}
.comp:active{transform:scale(.97)}
.comp.hit{box-shadow:0 0 0 3px var(--accent)}
.comp.dim{opacity:.32}
div.comp{cursor:default}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:18px}
.no{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(0,0,0,.14);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.cnt{font-size:12.5px;font-weight:700;opacity:.75;white-space:nowrap}
.cn{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere;padding-right:18px}
.pv{font-size:13px;opacity:.78;line-height:1.3;padding-right:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tip{margin:0;text-align:center;color:var(--ink3);font-size:13.5px}

/* configurazione iniziale */
.setup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:6px}
.setup p{margin:0;color:var(--ink2);max-width:32ch}
.step{display:flex;align-items:center;gap:22px;margin:6px 0}
.step b{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;min-width:2ch;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stp{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.stp:disabled{opacity:.35;cursor:default}
.setup .case{width:100%;margin-top:46px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px 16px;font-weight:700;font-size:17px;text-align:center;cursor:pointer;border:0;font-family:var(--display);letter-spacing:-.01em}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--field);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);font-weight:600}
.btn.ghost{background:none;color:var(--accent-text);font-weight:600}

/* foglio */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
#sheet .sh{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;
  padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.shh{display:flex;align-items:center;gap:12px}
.shh .no{width:34px;height:34px;border-radius:11px;background:hsl(var(--h) var(--cs) var(--cl));font-size:15px}
.shh input{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;padding:4px 0}
.shh input:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.sh h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em}
.sh .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.sh p.m{margin:0;font-size:14.5px;color:var(--ink2)}
.sh p.w{margin:0;font-size:14.5px;color:var(--bad);font-weight:600}
.add{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 5px 5px 14px}
.add input{flex:1;min-width:0;border:0;background:none;padding:9px 0;font-size:16px}
.add input:focus{outline:none}
.add:focus-within{border-color:var(--accent)}
.addbtn{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.addbtn svg{width:20px;height:20px;stroke:var(--accent-ink);stroke-width:2.6;fill:none;stroke-linecap:round}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 16px;min-height:50px}
.row+.row{border-top:1px solid var(--line)}
.row input{flex:1;min-width:0;border:0;background:none;padding:10px 0;font-size:16px}
.row input:focus{outline:none;box-shadow:0 1.5px 0 var(--accent)}
.del{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--ink3);cursor:pointer;font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.del:hover{color:var(--bad)}
.empty{margin:0;padding:22px 16px;text-align:center;color:var(--ink2);font-size:15px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.names{display:flex;flex-direction:column;gap:8px}
.names label{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px 0 10px}
.names label .no{background:hsl(var(--h) var(--cs) var(--cl))}
.names input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px}
.names input:focus{outline:none}
.names label:focus-within{border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;max-width:min(90%,420px);text-align:center}
@media (prefers-reduced-motion: reduce){.comp{transition:none}#sheet .sh{animation:none}}
</style>

<div id="app"><main id="view"></main></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var LS='la-mia-valigia-v1',HUES=[12,38,150,195,255,320,85,350],MAXN=12;
var S={comps:null};
var UI={q:'',open:null,draftN:4,names:[],confirm:'',confT:null};
var ref=null,saving=false,touched=false,saveT=null,toastT=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nid(){return 'v'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2400)}
function plural(n,a,b){return n+' '+(n===1?a:b)}
function find(id){return S.comps&&S.comps.find(function(c){return c.id===id})}
function hue(i){return HUES[i%HUES.length]}

/* ---------- salvataggio ---------- */
function pack(){return {comps:S.comps}}
function loadLocal(){try{var a=JSON.parse(localStorage.getItem(LS)||'null');if(a&&Array.isArray(a.comps))S.comps=a.comps}catch(e){}}
function save(){
  touched=true;
  try{localStorage.setItem(LS,JSON.stringify(pack()))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(flush,500);
}
async function flush(){
  if(!ref) return;
  if(saving){clearTimeout(saveT);saveT=setTimeout(flush,400);return}
  saving=true;
  try{await ref.set(pack())}catch(e){}
  saving=false;
}

/* ---------- disegno della valigia ---------- */
function caseHtml(comps,hits,q,preview){
  var n=comps.length,cols=n<=2?1:(n<=6?2:3),rem=n%cols,h='';
  comps.forEach(function(c,i){
    var cls='comp'+(q?(hits[c.id]?' hit':' dim'):'');
    var span=(i===n-1&&rem!==0)?' grid-column:span '+(cols-rem+1)+';':'';
    var items=c.items||[];
    var pv=items.slice(0,3).map(function(x){return esc(x.text)}).join(' · ')+(items.length>3?' · +'+(items.length-3):'');
    var inner='<span class="ctop"><span class="no">'+(i+1)+'</span><span class="cnt">'+(preview?'vuoto':(items.length?plural(items.length,'cosa','cose'):'vuoto'))+'</span></span>'
      +'<span class="cn">'+esc(c.name)+'</span>'+(items.length&&!preview?'<span class="pv">'+pv+'</span>':'');
    h+=preview
      ?'<div class="'+cls+'" style="--h:'+hue(i)+';'+span+'">'+inner+'</div>'
      :'<button type="button" class="'+cls+'" data-comp="'+c.id+'" style="--h:'+hue(i)+';'+span+'" aria-label="Apri '+esc(c.name)+'">'+inner+'</button>';
  });
  return '<div class="case"><div class="handle"></div><div class="shell"><div class="inner" style="--cols:'+cols+'">'+h+'</div><div class="latch l1"></div><div class="latch l2"></div></div><div class="wheel w1"></div><div class="wheel w2"></div></div>';
}
function previewComps(n){var a=[];for(var i=0;i<n;i++)a.push({id:'p'+i,name:'Scomparto '+(i+1),items:[]});return a}

/* ---------- schermate ---------- */
function setupHtml(){
  return '<section class="setup"><h1>Prepara la valigia</h1><p>Quanti scomparti ha la tua valigia?</p>'
   +'<div class="step"><button class="stp" data-act="sdec" type="button" aria-label="Meno scomparti">−</button><b id="sn" aria-live="polite">'+UI.draftN+'</b><button class="stp" data-act="sinc" type="button" aria-label="Più scomparti">+</button></div>'
   +'<div id="spv" style="width:100%">'+caseHtml(previewComps(UI.draftN),{},'',true)+'</div>'
   +'<div style="width:100%;margin-top:6px"><button class="btn main" data-act="create" type="button">Crea la valigia</button></div>'
   +'<p class="tip" style="margin-top:2px">Potrai cambiare numero e nomi in qualsiasi momento.</p></section>';
}
function view(){
  var v=$('#view');
  if(!S.comps){v.innerHTML=setupHtml();return}
  var n=S.comps.length,total=S.comps.reduce(function(a,c){return a+c.items.length},0);
  v.innerHTML='<header class="lt"><div class="ltrow"><h1>La mia valigia</h1><button class="link" data-act="settings" type="button">Modifica</button></div>'
   +'<p class="sub">'+plural(n,'scomparto','scomparti')+' · '+plural(total,'cosa','cose')+'</p></header>'
   +'<label class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Dov\'è lo spazzolino? Cerca una cosa" value="'+esc(UI.q)+'" autocomplete="off" aria-label="Cerca una cosa"></label>'
   +'<div id="qres"></div><div id="case"></div><p class="tip">Tocca uno scomparto per aprirlo.</p>';
  updateCase();
}
function updateCase(){
  if(!S.comps||!$('#case')) return;
  var q=norm(UI.q),hits={},found=[];
  if(q) S.comps.forEach(function(c){
    var m=c.items.filter(function(i){return norm(i.text).indexOf(q)>=0});
    if(m.length){hits[c.id]=1;found.push('<span><b>'+esc(c.name)+'</b>: '+m.map(function(i){return esc(i.text)}).join(', ')+'</span>')}
  });
  $('#qres').innerHTML=q?(found.length?'<div class="qr">'+found.join('')+'</div>':'<div class="qr none">Non trovo “'+esc(UI.q.trim())+'” in nessuno scomparto.</div>'):'';
  $('#case').innerHTML=caseHtml(S.comps,hits,q,false);
}

/* ---------- foglio di uno scomparto ---------- */
function openComp(id){
  var c=find(id);if(!c) return;
  UI.open=id;UI.confirm='';
  var i=S.comps.indexOf(c),el=$('#sheet');el.hidden=false;
  el.innerHTML='<div class="sh" role="dialog" aria-modal="true" aria-label="Scomparto" style="--h:'+hue(i)+'">'
   +'<div class="shh"><span class="no">'+(i+1)+'</span><input id="cname" value="'+esc(c.name)+'" aria-label="Nome dello scomparto" maxlength="40"><button class="link" data-act="close" type="button">Fine</button></div>'
   +'<p class="sub" id="ccount" style="margin:-4px 0 0"></p>'
   +'<form class="add" id="cadd" autocomplete="off"><input id="cnew" type="text" placeholder="Aggiungi una cosa (es. spazzolino)" enterkeyhint="done" aria-label="Nuova cosa"><button class="addbtn" type="submit" aria-label="Aggiungi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></form>'
   +'<p class="m">Puoi scrivere più cose insieme separate da virgola.</p>'
   +'<div class="group" id="clist"></div>'
   +'<div class="stack"><button class="btn danger" data-act="clear" type="button" id="clearBtn">Svuota lo scomparto</button></div></div>';
  renderList();
  if(!c.items.length) setTimeout(function(){var n=$('#cnew');if(n)n.focus()},80);
}
function renderList(){
  var c=find(UI.open);if(!c||!$('#clist')) return;
  $('#ccount').textContent=c.items.length?plural(c.items.length,'cosa','cose'):'Ancora vuoto';
  $('#clist').innerHTML=c.items.length?c.items.map(function(it){
    return '<div class="row" data-iid="'+it.id+'"><input data-it value="'+esc(it.text)+'" aria-label="Cosa" maxlength="80"><button class="del" data-act="delit" type="button" aria-label="Rimuovi '+esc(it.text)+'">×</button></div>';
  }).join(''):'<p class="empty">Niente qui dentro. Aggiungi la prima cosa nel campo sopra.</p>';
  var b=$('#clearBtn');if(b) b.hidden=!c.items.length;
}
function closeSheet(){
  var el=$('#sheet');el.hidden=true;el.innerHTML='';UI.open=null;UI.confirm='';
  if(S.comps) view();
}
function askConfirm(key,btn,ask,normal){
  if(UI.confirm===key) return true;
  UI.confirm=key;btn.textContent=ask;
  clearTimeout(UI.confT);UI.confT=setTimeout(function(){if(UI.confirm===key){UI.confirm='';if(btn&&btn.isConnected)btn.textContent=normal}},4000);
  return false;
}

/* ---------- foglio della valigia ---------- */
function openSettings(){
  UI.draftN=S.comps.length;UI.names=S.comps.map(function(c){return c.name});UI.confirm='';
  renderSettings();
}
function lostItems(){
  var l=0;if(UI.draftN<S.comps.length) S.comps.slice(UI.draftN).forEach(function(c){l+=c.items.length});
  return l;
}
function renderSettings(){
  var el=$('#sheet');el.hidden=false;
  var names='';
  for(var i=0;i<UI.draftN;i++){
    var nm=UI.names[i]!=null?UI.names[i]:'Scomparto '+(i+1);
    names+='<label style="--h:'+hue(i)+'"><span class="no">'+(i+1)+'</span><input data-ren="'+i+'" value="'+esc(nm)+'" aria-label="Nome scomparto '+(i+1)+'" maxlength="40"></label>';
  }
  var lost=lostItems();
  el.innerHTML='<div class="sh" role="dialog" aria-modal="true" aria-label="Modifica la valigia"><h2>La mia valigia</h2>'
   +'<div class="cap">Numero di scomparti</div>'
   +'<div class="step" style="justify-content:center"><button class="stp" data-act="dec" type="button" aria-label="Meno scomparti"'+(UI.draftN<=1?' disabled':'')+'>−</button><b>'+UI.draftN+'</b><button class="stp" data-act="inc" type="button" aria-label="Più scomparti"'+(UI.draftN>=MAXN?' disabled':'')+'>+</button></div>'
   +(lost?'<p class="w">'+(lost===1?'1 cosa':lost+' cose')+' negli scomparti tolti '+(lost===1?'verrà cancellata':'verranno cancellate')+'.</p>':'')
   +'<div class="cap">Nomi degli scomparti</div><div class="names">'+names+'</div>'
   +'<div class="stack"><button class="btn main" data-act="apply" type="button" id="applyBtn">Salva</button>'
   +'<button class="btn danger" data-act="wipe" type="button" id="wipeBtn">Ricomincia da zero</button>'
   +'<button class="btn ghost" data-act="close-set" type="button">Annulla</button></div></div>';
}
function applySettings(){
  var lost=lostItems(),b=$('#applyBtn');
  if(lost&&!askConfirm('reduce',b,'Conferma e cancella','Salva')) return;
  var out=[];
  for(var i=0;i<UI.draftN;i++){
    var old=S.comps[i],nm=(UI.names[i]!=null?UI.names[i]:'').trim()||'Scomparto '+(i+1);
    out.push(old?{id:old.id,name:nm,items:old.items}:{id:nid(),name:nm,items:[]});
  }
  S.comps=out;save();closeSheet();toast('Valigia aggiornata');
}

/* ---------- eventi ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var comp=t.closest('[data-comp]');
  if(comp){openComp(comp.dataset.comp);return}
  var a=t.closest('[data-act]');if(!a) return;
  var act=a.dataset.act;
  if(act==='sinc'){UI.draftN=Math.min(MAXN,UI.draftN+1);$('#sn').textContent=UI.draftN;$('#spv').innerHTML=caseHtml(previewComps(UI.draftN),{},'',true)}
  else if(act==='sdec'){UI.draftN=Math.max(1,UI.draftN-1);$('#sn').textContent=UI.draftN;$('#spv').innerHTML=caseHtml(previewComps(UI.draftN),{},'',true)}
  else if(act==='create'){
    S.comps=previewComps(UI.draftN).map(function(c){return {id:nid(),name:c.name,items:[]}});
    save();view();toast('Valigia creata: tocca uno scomparto');
  }
  else if(act==='settings'){openSettings()}
  else if(act==='inc'){UI.draftN=Math.min(MAXN,UI.draftN+1);UI.confirm='';renderSettings()}
  else if(act==='dec'){UI.draftN=Math.max(1,UI.draftN-1);UI.confirm='';renderSettings()}
  else if(act==='apply'){applySettings()}
  else if(act==='wipe'){
    if(askConfirm('wipe',a,'Tocca ancora: cancella tutto','Ricomincia da zero')){
      S.comps=null;UI.q='';UI.draftN=4;save();closeSheet();view();
    }
  }
  else if(act==='close-set'){closeSheet()}
  else if(act==='close'){closeSheet()}
  else if(act==='delit'){
    var c=find(UI.open),row=a.closest('[data-iid]');
    if(c&&row){c.items=c.items.filter(function(x){return x.id!==row.dataset.iid});save();renderList()}
  }
  else if(act==='clear'){
    var cc=find(UI.open);
    if(cc&&askConfirm('clear',a,'Tocca ancora per svuotare','Svuota lo scomparto')){cc.items=[];UI.confirm='';a.textContent='Svuota lo scomparto';save();renderList()}
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='cadd') return;
  e.preventDefault();
  var c=find(UI.open),inp=$('#cnew');if(!c||!inp) return;
  var parts=inp.value.split(/[,;\n]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!parts.length){inp.focus();return}
  parts.forEach(function(p){c.items.push({id:nid(),text:p})});
  inp.value='';save();renderList();inp.focus();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){UI.q=t.value;updateCase();return}
  if(t.id==='cname'){var c=find(UI.open);if(c){c.name=t.value||'Scomparto';save()}return}
  if(t.matches&&t.matches('[data-it]')){
    var c2=find(UI.open),row=t.closest('[data-iid]');
    if(c2&&row){var it=c2.items.find(function(x){return x.id===row.dataset.iid});if(it){it.text=t.value;save()}}
    return;
  }
  if(t.matches&&t.matches('[data-ren]')){UI.names[+t.dataset.ren]=t.value}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- icona e manifest per la schermata Home ---------- */
function setupInstall(){
  try{
    function ic(n){var c=document.createElement('canvas');c.width=c.height=n;var x=c.getContext('2d');
      x.fillStyle='#0f7a7d';x.fillRect(0,0,n,n);
      x.strokeStyle='#fff';x.lineWidth=n*.07;x.lineCap='round';
      x.beginPath();x.moveTo(n*.4,n*.3);x.lineTo(n*.4,n*.22);x.lineTo(n*.6,n*.22);x.lineTo(n*.6,n*.3);x.stroke();
      x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(n*.24,n*.3,n*.52,n*.46,n*.07):x.rect(n*.24,n*.3,n*.52,n*.46);x.fill();
      x.fillStyle='#0f7a7d';x.fillRect(n*.37,n*.3,n*.05,n*.46);x.fillRect(n*.58,n*.3,n*.05,n*.46);
      return c.toDataURL('image/png')}
    var a=ic(180),b=ic(192),c=ic(512);
    var l=document.createElement('link');l.rel='apple-touch-icon';l.href=a;document.head.appendChild(l);
    var l2=document.createElement('link');l2.rel='icon';l2.href=b;document.head.appendChild(l2);
    if(/^https?:/.test(location.protocol)&&!window.claude){
      var u=location.href.split('#')[0];
      var m={name:'La Mia Valigia',short_name:'Valigia',lang:'it',start_url:u,scope:u.replace(/[^\/]*$/,''),display:'standalone',background_color:'#eef2f4',theme_color:'#0f7a7d',icons:[{src:b,sizes:'192x192',type:'image/png'},{src:c,sizes:'512x512',type:'image/png'}]};
      var ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml);
    }
  }catch(e){}
}

/* ---------- avvio ---------- */
async function boot(){
  loadLocal();view();setupInstall();
  try{
    var cl=window.claude;if(!cl||!cl.use) return;
    var user=await cl.use('user'),dbm=await cl.use('db');
    var uid=user?await user.id():null;
    if(!dbm||!uid) return;
    ref=dbm.doc('data/users/'+uid+'/valigia');
    var snap=await ref.get();
    if(touched){flush();return}
    if(snap.exists){
      var d=snap.data()||{};
      S.comps=Array.isArray(d.comps)?d.comps:null;
      try{localStorage.setItem(LS,JSON.stringify(pack()))}catch(e){}
      if(!UI.open&&$('#sheet').hidden) view();
    }else if(S.comps){flush()}
  }catch(e){ref=null}
}
boot();
})();
</script>
